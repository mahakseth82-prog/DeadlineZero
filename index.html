<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DeadlineZero — Intelligent AI Deadline Coach & Focus Sprint Engine</title>
    
    <!-- Meta Descriptions & SEO -->
    <meta name="description" content="DeadlineZero is an intelligent AI productivity coach powered by Google Gemini that turns deadline panic into structured, high-velocity execution." />
    <meta name="author" content="Mahak Seth" />
    
    <!-- PWA / Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeadlineZero" />

    <!-- Typography: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DeadlineZero — Turning Deadline Panic into Intelligent Execution" />
    <meta property="og:description" content="AI productivity coach powered by Google Gemini: real-time risk triage, Pomodoro ambient focus room, and emergency sprint roadmaps." />
    <meta property="og:image" content="/assets/screenshots/dashboard.png" />

    <script>
      try {
        const uiStore = JSON.parse(localStorage.getItem('deadlinezero-ui'));
        if (uiStore && uiStore.state && uiStore.state.themeMode === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
